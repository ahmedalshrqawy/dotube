<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOTUBE</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-6 sm:p-8 rounded-xl shadow-lg w-full max-w-md border border-gray-200">
        <!-- العنوان وحقوق الملكية -->
        <h1 class="text-5xl font-extrabold mb-1 text-center text-red-600 tracking-wider">DOTUBE</h1>
        <p class="text-center text-sm text-gray-500 mb-6 font-bold uppercase tracking-widest">Developed by ahmed shawki</p>
        
        <label class="block text-sm font-medium text-gray-700 mb-2">رابط الفيديو:</label>
        <input type="text" id="youtubeUrl" placeholder="https://www.youtube.com/watch?v=..." 
               class="w-full p-3 border border-gray-300 rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-red-500 text-left" dir="ltr">
        
        <label class="block text-sm font-medium text-gray-700 mb-2">صيغة التحميل:</label>
        <select id="format" class="w-full p-3 border border-gray-300 rounded-lg mb-6 bg-white focus:outline-none focus:ring-2 focus:ring-red-500">
            <option value="mp4">فيديو عالية الجودة (MP4)</option>
            <option value="mp3">صوت فقط (MP3)</option>
        </select>
        
        <button id="downloadBtn" onclick="startDownload()" 
                class="w-full bg-red-600 text-white p-3 rounded-lg font-bold hover:bg-red-700 transition duration-200">
            تحميل الآن
        </button>

        <!-- شريط التقدم (مخفي في البداية) -->
        <div id="progressContainer" class="hidden mt-6">
            <div class="w-full bg-gray-200 rounded-full h-4 mb-2 overflow-hidden">
                <div id="progressBar" class="bg-red-600 h-4 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
            <p id="progressText" class="text-center text-sm font-bold text-gray-700">0%</p>
        </div>

        <!-- رسالة النجاح والدعوة (مخفية في البداية) -->
        <div id="successMessage" class="hidden mt-6 bg-green-50 border border-green-200 p-4 rounded-lg text-center">
            <p class="text-lg text-green-700 font-extrabold">تم التحميل بنجاح! 🎉</p>
            <p class="text-md text-green-600 font-bold mt-2">. أدعي لعمك احمد بك الشرقاوي</p>
        </div>
    </div>

    <script>
        let progressInterval;

        function startDownload() {
            const url = document.getElementById('youtubeUrl').value;
            const format = document.getElementById('format').value;
            const btn = document.getElementById('downloadBtn');
            
            if(!url.includes('youtube.com') && !url.includes('youtu.be')) {
                alert("يرجى إدخال رابط يوتيوب صحيح");
                return;
            }

            // إخفاء الدعوة وإظهار العداد
            document.getElementById('progressContainer').classList.remove('hidden');
            document.getElementById('successMessage').classList.add('hidden');
            document.getElementById('progressBar').style.width = '0%';
            document.getElementById('progressText').innerText = '0%';
            btn.disabled = true;
            btn.innerText = 'جاري السحب من يوتيوب...';

            // إرسال طلب التحميل
            const apiUrl = `http://localhost:8000/download?url=${encodeURIComponent(url)}&format=${format}`;
            window.location.href = apiUrl; 

            // مراقبة العداد من السيرفر كل ثانية
            progressInterval = setInterval(() => {
                fetch(`http://localhost:8000/progress?url=${encodeURIComponent(url)}`)
                    .then(response => response.json())
                    .then(data => {
                        let progressValue = data.progress;
                        let cleanNum = progressValue.replace(/[^0-9.]/g, ''); // استخراج الرقم فقط
                        
                        if(cleanNum) {
                            document.getElementById('progressBar').style.width = cleanNum + '%';
                            document.getElementById('progressText').innerText = progressValue;
                        }

                        // لما يوصل 100%
                        if(progressValue.includes('100') || progressValue === '100%') {
                            clearInterval(progressInterval);
                            btn.disabled = false;
                            btn.innerText = 'تحميل فيديو جديد';
                            
                            // إخفاء العداد وإظهار الدعوة
                            document.getElementById('progressContainer').classList.add('hidden');
                            document.getElementById('successMessage').classList.remove('hidden');
                        }
                    })
                    .catch(err => console.error(err));
            }, 1000); 
        }
    </script>
</body>
</html>
