<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOTUBE - تحميل فيديوهات يوتيوب</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f4f9; text-align: center; padding: 50px; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); display: inline-block; width: 100%; max-width: 500px; }
        input[type="text"] { width: 80%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        select { padding: 10px; margin: 10px 0; border-radius: 5px; }
        button { background: #ff0000; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background: #cc0000; }
        #progress { margin-top: 20px; font-weight: bold; color: #333; }
    </style>
</head>
<body>
    <div class="container">
        <h2>DOTUBE 🚀</h2>
        <p>أداة التحميل الخاصة بالمهندس أحمد الشرقاوي</p>
        <input type="text" id="url" placeholder="حط رابط اليوتيوب هنا..." required><br>
        <select id="format">
            <option value="mp4">فيديو (MP4)</option>
            <option value="mp3">صوت فقط (MP3)</option>
        </select><br>
        <button onclick="startDownload()">تحميل</button>
        <div id="progress"></div>
    </div>

    <script>
        async function startDownload() {
            const url = document.getElementById('url').value;
            const format = document.getElementById('format').value;
            const progressDiv = document.getElementById('progress');

            if (!url) {
                alert('من فضلك ادخل الرابط أولاً!');
                return;
            }

            progressDiv.innerHTML = 'جاري التحضير والتحميل... ⏳';

            try {
                const response = await fetch(`/download?url=${encodeURIComponent(url)}&format=${format}`);
                
                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.detail || 'حدث خطأ أثناء التحميل');
                }

                const blob = await response.blob();
                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = ''; 
                document.body.appendChild(a);
                a.click();
                a.remove();
                
                progressDiv.innerHTML = '✅ تم التحميل بنجاح! دعوة لعمنا أحمد بك الشرقاوي بقى 😉';
            } catch (error) {
                progressDiv.innerHTML = '❌ خطأ: ' + error.message;
            }
        }
    </script>
</body>
</html>
